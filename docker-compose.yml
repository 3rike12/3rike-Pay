# 3rike Pay - API + Redis, with an optional Postgres.
#
# Built for Coolify (Docker Compose build pack) and works the same locally:
#   - no fixed container_name and no published host ports, so redeploys and
#     other apps on the same server never collide. Coolify's proxy routes your
#     domain to the app's port 3000. For local ports see docker-compose.local.yml.
#   - Your variables are NOT set here. Set them in Coolify (or in a local .env):
#     see .env.example for the full list. `.env` is optional.
#   - Redis runs the durable payment-tracking queue (BullMQ). The API process
#     hosts the worker, so there is no separate worker container.
#
# Coolify: choose "Docker Compose", point it at this file, set your variables,
# give the `app` service your domain (port 3000), and do NOT enable the
# local-db profile - use a Coolify Postgres (or any hosted one) via DATABASE_URL.
#
# Local, everything included (API + Redis + Postgres):
#   cp .env.example .env
#   # in .env: DATABASE_URL=postgresql://threerike:threerike@postgres:5432/threerike_pay
#   #          COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
#   docker compose --profile local-db up --build
#
# Redis is part of this stack (the `redis` service below, with persistence on and
# eviction off). The app is wired to it by REDIS_URL, set in this file, so you
# never set it yourself.
#
# Variables to set in Coolify: section 1 of .env.example is the minimum
# (DATABASE_URL, PUBLIC_BASE_URL, the WHATSAPP_* values, NEAR_INTENTS_RECIPIENT,
# TREASURY_ADDRESS); later sections switch on payouts, the Privy signer and KYC.
#
# On boot the app runs `prisma db push`, so DATABASE_URL must point at a
# database you intend it to change.

services:
  # Opt-in: only starts with `--profile local-db`. Not for Coolify.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threerike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threerike}
      POSTGRES_DB: ${POSTGRES_DB:-threerike_pay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-threerike}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The research agent's conversation memory (LangGraph's Postgres checkpointer). A database used ONLY for this,
  # apart from the ledger: no published port, so only the app can reach it, and its own volume. It holds short chats
  # and what the agent's tools returned for them (for example a person's holdings), and the app deletes
  # conversations idle for more than a day. It is only used when STOCKS_AGENT_ENGINE=langgraph.
  agent-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:-change-me-agent-memory}
      POSTGRES_DB: agent_memory
    volumes:
      - agentdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_memory"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queue-grade settings: persist jobs to disk so a restart does not lose
    # in-flight payment checks, and NEVER evict keys (an evicted job is a
    # payment we would stop watching).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      agent-db:
        # Only wait for it to start, never for it to be healthy: the agent falls back to in-memory if this database is
        # unreachable, so a problem here must never stop payments from starting.
        condition: service_started
      postgres:
        condition: service_healthy
        required: false # only present with --profile local-db
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Wiring only. Everything else comes from your variables.
      PORT: 3000
      # Always this stack's Redis; this also turns on the BullMQ payment queue.
      REDIS_URL: redis://redis:6379
      # The agent's own memory database (see agent-db above). Unused unless STOCKS_AGENT_ENGINE=langgraph.
      AGENT_DB_URL: postgresql://agent:${AGENT_DB_PASSWORD:-change-me-agent-memory}@agent-db:5432/agent_memory
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 40s # `prisma db push` runs before the server starts

volumes:
  pgdata:
  redisdata:
  agentdata:
