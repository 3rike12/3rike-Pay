<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/pay/favicon.png">
<link rel="apple-touch-icon" href="/pay/favicon.png">
<title>Pay an invoice · 3rike Pay</title>
<style>
  :root {
    --bg: #f3f5f2; --bg2: #e9efe9; --card: #ffffff; --text: #101a14; --muted: #5d6c63; --line: #e2e8e2;
    --soft: #f5f8f5; --accent: #0a7d4d; --accent-2: #0c9a60; --accent-text: #ffffff; --bad: #b3261e;
    --shadow: 0 1px 2px rgba(16,26,20,.05), 0 8px 24px rgba(16,26,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b110e; --bg2: #101a15; --card: #141d18; --text: #e9f0ea; --muted: #8fa196; --line: #243029;
            --soft: #0f1712; --accent: #3ddc97; --accent-2: #2fc384; --accent-text: #05221a; --bad: #ff8a80;
            --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(900px 420px at 50% -120px, var(--bg2), transparent 70%), var(--bg); }
  main { max-width: 460px; margin: 0 auto; padding: 48px 16px calc(40px + env(safe-area-inset-bottom)); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand img { width: 40px; height: 40px; border-radius: 12px; }
  .brand b { font-size: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  input { width: 100%; font: inherit; color: var(--text); padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line);
          background: var(--soft); }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; cursor: pointer; padding: 13px 14px; border: 0; border-radius: 14px;
           background: var(--accent); color: var(--accent-text); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { color: var(--bad); font-size: 14px; margin: 10px 0 0; min-height: 1.2em; }
  .foot { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="brand"><img src="/pay/favicon.png" alt=""><b>3rike Pay</b></div>
    <form class="card" id="f" novalidate>
      <h1>Pay an invoice</h1>
      <p>Open the link you were sent, or enter the payment reference from it.</p>
      <label for="ref">Payment reference or link</label>
      <input id="ref" name="ref" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="3RIKE-20261114-ABC123" autofocus>
      <div class="err" id="err" role="alert"></div>
      <button type="submit">Continue</button>
    </form>
    <div class="foot">Pay from any wallet, on any chain.</div>
  </main>
<script>
  // Accepts a bare reference or a whole pay link; sends the person to /pay/<reference>.
  function referenceFrom(raw) {
    var s = String(raw || "").trim();
    var m = s.match(/\/pay\/([^/?#\s]+)/i);
    if (m) s = m[1];
    s = s.replace(/[?#].*$/, "");
    return /^[A-Za-z0-9_-]{4,64}$/.test(s) ? s : "";
  }
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var ref = referenceFrom(document.getElementById("ref").value);
    var err = document.getElementById("err");
    if (!ref) { err.textContent = "That doesn't look like a payment reference. Check the link you were sent."; return; }
    err.textContent = "";
    window.location.href = "/pay/" + encodeURIComponent(ref);
  });
</script>
</body>
</html>
