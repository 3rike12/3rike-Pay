<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/mark.png" />

    <title>3rike Pay — your bank is a WhatsApp message</title>
    <meta
      name="description"
      content="Send money to any Nigerian bank by typing it the way you'd say it. No app to download, no forms to fill. 3rike Pay lives in WhatsApp."
    />
    <meta name="theme-color" content="#F5F5F0" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="3rike Pay — your bank is a WhatsApp message" />
    <meta
      property="og:description"
      content="Send money to any Nigerian bank by typing it the way you'd say it. No app to download, no forms to fill."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The hero photograph is the largest paint on the home page, so it is
         fetched alongside the document rather than after the bundle parses. -->
    <link
      rel="preload"
      as="image"
      href="/hero-lagos-1920.webp"
      imagesrcset="/hero-lagos-1200.webp 1200w, /hero-lagos-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;500;600;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
