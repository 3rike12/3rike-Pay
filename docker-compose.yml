# 3rike Pay - local stack: API + its own Postgres + Redis
# Usage:
#   1. cp .env.example .env  (if you don't have one) and fill secrets
#   2. docker compose up --build
#   3. API -> http://localhost:3000/health
#
# DATABASE_URL / REDIS_URL in `environment:` override whatever is in .env
# so the app always uses THESE postgres + redis containers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: threerike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threerike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threerike}
      POSTGRES_DB: ${POSTGRES_DB:-threerike_pay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-threerike}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: threerike-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: threerike-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      # Own postgres DB (overrides .env):
      DATABASE_URL: postgresql://${POSTGRES_USER:-threerike}:${POSTGRES_PASSWORD:-threerike}@postgres:5432/${POSTGRES_DB:-threerike_pay}
      # Own redis (overrides .env):
      REDIS_URL: redis://redis:6379

volumes:
  pgdata:
  redisdata:
